services:
  - type: web
    name: fraud-detection-api
    runtime: python
    region: oregon
    plan: free
    rootDir: DataAnalytics-L2-FraudDetection/app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONIOENCODING
        value: utf-8
    healthCheckPath: /
